<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>用户注册</title>
</head>
<body background="image/982.jfif">
<center>
    <img src="image/xiaohui.png">
    <font color="white">
    <p>
        购书网
    <h1 align="center">用户注册</h1></font>
    <form action="registerSer" method="post">
        <table>
            <tr>
                <td><font color="red">*</font>用户名：</td>
                <td><input type="text" name="UserName"/></td>
            </tr>
            <tr>
                <td><font color="red">*</font>密码：</td>
                <td><input type="text" name="PassWord"/></td>
            </tr>
            <tr>

                <td><font color="red">*</font>确认密码:</td>
                <td><input type="text" name="PassWord1"/></td>
                >
            </tr>
            <tr>
                <td><font color="red">*</font>真实姓名:</td>
                <td><input type="text" name="Names"/></td>
            </tr>
            <tr>
                <td>性别:</td>
                <td><select name="sex">
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select></td>
            </tr>
            <tr>
                <td>联系地址:</td>
                <td><input type="text" name="Address"/></td>
            </tr>
            <tr>
                <td>联系邮编:</td>
                <td><input type="text" name="Post"/></td>
            </tr>
            <tr>
                <td>联系电话:</td>
                <td><input type="text" name="Phone"/></td>
                >
            </tr>
            <tr>
                <td>电子邮件:</td>
                <td><input type="text" name="Email"/></td>
                >
            </tr>
            <tr>
                &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; <td align="right"><input type="submit" name="注册" value="注册"></td>
                <td align="left"><input type="submit" name="取消" value="取消"></td>
            </tr>
        </table>
    </form>
    <a href="index.jsp">返回主页面</a>
    <br><br><br><br><br>
    <font color="white">
    <p>购书网欢迎您的光临！</p>
    </font>
</center>
</body>
</html>
